name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing in this workflow writes to the repository
# and nothing here touches a publishing credential.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Every native runner GitHub offers free to public repositories, on
  # both architectures. No emulation: the point is to execute the AVX2
  # kernels on real x86-64 silicon and the NEON kernels on real ARM,
  # under three operating systems each.
  test:
    name: test ${{ matrix.arch }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS rows are commented out to keep the runner mix cheap.
        # Standard runners are free and unmetered on public
        # repositories, macOS included, so this is a scheduling and
        # queue-time choice rather than a billing one -- uncomment to
        # restore. Release wheels are still built on macOS, so macOS
        # users are unaffected.
        include:
          - { os: ubuntu-latest,    arch: x86-64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: windows-latest,   arch: x86-64 }
          - { os: windows-11-arm,   arch: aarch64 }
          # - { os: macos-latest,   arch: aarch64 }
          # - { os: macos-15-intel, arch: x86-64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every runner in this matrix has a vector path: AVX2 on the
      # x86-64 ones, NEON on the Apple silicon one. Requiring it means a
      # dispatch bug that silently falls back to the scalar loop fails
      # the build instead of making every reduction test vacuous.
      - run: cargo test --release --all-targets
        env:
          PK_REQUIRE_SIMD: "1"
      - run: cargo test --release --doc

  # The whole point of the feature flags is that they change speed and
  # nothing else. Every combination has to build and pass on its own,
  # because a caller who disables `simd` or `parallel` still gets the
  # same numbers.
  features:
    name: feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features simd"
          - "--no-default-features --features parallel"
          - "--features gpu"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release ${{ matrix.features }}

  # Two MSRVs, because the `gpu` feature drags in wgpu, which needs a
  # newer compiler than the rest of the crate. Someone who does not want
  # a GPU backend should not be forced onto a newer toolchain for it.
  msrv:
    name: MSRV ${{ matrix.rust }} (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.85.0"
            label: default features
            args: "--lib"
          - rust: "1.87.0"
            label: all features
            args: "--lib --all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # `cargo check` rather than `test`: the dev-dependencies carry
      # their own, higher MSRVs, and they are not part of the contract
      # a downstream user consumes.
      - run: cargo check ${{ matrix.args }}

  # The load-bearing test of this whole repository: the optimised,
  # vectorised, threaded engine must still produce the exact bits the
  # v1.0.0 reference produced. `GOLDEN.txt` was generated by the
  # original implementation and is never regenerated.
  golden:
    name: bit-identity ${{ matrix.arch }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS rows are commented out to keep the runner mix cheap.
        # Standard runners are free and unmetered on public
        # repositories, macOS included, so this is a scheduling and
        # queue-time choice rather than a billing one -- uncomment to
        # restore. Release wheels are still built on macOS, so macOS
        # users are unaffected.
        include:
          - { os: ubuntu-latest,    arch: x86-64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: windows-latest,   arch: x86-64 }
          - { os: windows-11-arm,   arch: aarch64 }
          # - { os: macos-latest,   arch: aarch64 }
          # - { os: macos-15-intel, arch: x86-64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate golden values
        run: cargo run --release --example golden > golden.actual
      - name: Compare against the v1.0.0 baseline
        shell: bash
        run: |
          if ! diff -u GOLDEN.txt golden.actual; then
            echo "::error::Engine output diverged from the v1.0.0 reference."
            echo "The optimised paths are required to be bit-identical."
            exit 1
          fi
          echo "All golden values match v1.0.0 bit for bit."

  # GitHub's runners have no GPU, but Mesa ships lavapipe, a software
  # Vulkan device. That is enough to compile the WGSL, run the real
  # dispatches, and check the device reduction against the host --
  # which is what actually breaks. PK_REQUIRE_GPU turns the usual
  # "no device, skip" into a hard failure so the job cannot pass
  # vacuously.
  gpu:
    name: GPU backend (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan device
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          vulkaninfo --summary || true
      - name: Run the GPU test suite
        env:
          PK_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
        run: cargo test --release --features gpu --test gpu -- --nocapture

  python:
    name: python ${{ matrix.python }} on ${{ matrix.arch }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - { os: ubuntu-latest,    arch: x86-64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: windows-latest,   arch: x86-64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist perturbation-kernel
      # Run from the repository root, not from `python/`. That
      # directory contains the pure-Python half of the package, and with
      # it as the working directory `import perturbation_kernel` picks
      # up the source tree instead of the installed wheel -- and the
      # source tree has no compiled extension in it, because the built
      # `.so` is gitignored. Testing the wheel is the whole point.
      - name: Run the test suite
        run: python -m pytest python/tests -v

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the docs with intra-doc links checked
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
        run: cargo doc --no-deps --all-features

  # Targets with no hosted runner. Build-only, but it is the portable
  # scalar path that has to keep compiling everywhere: someone on RISC-V
  # or a musl container gets the same numbers, just without the vector
  # kernels.
  cross:
    name: cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-musl, args: "" }
          - { target: x86_64-unknown-linux-musl,  args: "" }
          - { target: armv7-unknown-linux-gnueabihf, args: "--no-default-features --features parallel" }
          - { target: riscv64gc-unknown-linux-gnu,   args: "--no-default-features --features parallel" }
          - { target: powerpc64le-unknown-linux-gnu, args: "--no-default-features --features parallel" }
          - { target: aarch64-linux-android,      args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --target ${{ matrix.target }} ${{ matrix.args }}
