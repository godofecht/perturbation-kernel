name: Release

# Tag a version to cut a release:
#
#     git tag v2.0.0 && git push origin v2.0.0
#
# That builds wheels for every platform, publishes them to PyPI, and
# publishes the Rust crate to crates.io. Running the workflow by hand
# builds and uploads the wheels as artifacts without publishing
# anything, which is the way to check a release before committing to it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheel ${{ matrix.platform.target }} on ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # `native` marks the rows whose wheel the builder can actually
        # install, which is the only place a smoke test means anything.
        # The Linux aarch64 wheel is cross-built in a manylinux
        # container and cannot run on the x86-64 host.
        platform:
          - { os: ubuntu-latest,   target: x86_64,  native: true }
          - { os: ubuntu-latest,   target: aarch64, native: false }
          - { os: macos-15-intel,  target: x86_64,  native: true }
          - { os: macos-latest,    target: aarch64, native: true }
          - { os: windows-latest,  target: x64,     native: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # One abi3 wheel per platform serves CPython 3.8 and up.
          args: --release --out dist --manifest-path python/Cargo.toml
          sccache: "true"
          # `manylinux` cross-builds run in a container old enough to
          # keep the wheel broadly installable.
          manylinux: auto

      - name: Smoke-test the wheel
        # A wheel that imports and produces the expected value is worth
        # more than one that merely built.
        if: matrix.platform.native
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist perturbation-kernel
          python -c "
          import perturbation_kernel as pk
          print('version ', pk.__version__)
          print('backends', pk.available_backends())
          print('simd    ', pk.simd_path())
          r = pk.Markov(k=5, theta_max=0.3).run(pk.Config(n=50_000, seed=7))
          a = pk.Markov(k=5, theta_max=0.3).run(pk.Config(n=50_000, seed=7, backend='scalar'))
          assert r.value.hex() == a.value.hex(), 'backends disagreed in the built wheel'
          assert 0.0 <= r.value <= 1.0
          print('ok      ', r)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  pypi:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      # Requested so the job can switch to trusted publishing later
      # without a permissions change; the token below takes precedence
      # while it is set.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Re-running a release must not fail on files PyPI already
          # has. Uploads are immutable, so a repeat is a no-op, not an
          # error worth stopping the run for.
          skip-existing: true
          # Omit this and the action falls back to trusted publishing,
          # which is the better long-term setup once a publisher is
          # configured at https://pypi.org/manage/account/publishing/
          password: ${{ secrets.PYPI_API_TOKEN }}

  crates-io:
    name: publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    permissions:
      # Trusted publishing: crates.io verifies this workflow's OIDC
      # token against the publisher configured on the crate, so there is
      # no stored credential to leak or rotate. The publisher is pinned
      # to this repository, this workflow file and this environment.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange the OIDC token for a short-lived registry token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the core crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # The Python crate is `publish = false`; only the core crate
        # goes to crates.io. `--no-verify` is deliberately not used: the
        # package is rebuilt from the archive before upload.
        #
        # crates.io uploads are immutable, so re-running a release for a
        # version it already has should be a no-op rather than a red
        # build. This mirrors `skip-existing` on the PyPI side.
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if curl -sf "https://crates.io/api/v1/crates/perturbation-kernel/$VERSION" \
               -H 'User-Agent: perturbation-kernel release workflow' >/dev/null; then
            echo "::notice::crates.io already has $VERSION; nothing to publish."
            exit 0
          fi
          cargo publish --all-features
